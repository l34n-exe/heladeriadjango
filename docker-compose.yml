services:
  postgres:
    image: postgres:15
    container_name: heladeria_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data:delegated
    networks:
      - red
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  heladeria_api:
    image: heladeria-django:3.0
    container_name: heladeria_api
    build:
      context: ./backend/config/django-image
      dockerfile: Dockerfile
    volumes:
      - ./backend/src/django:/usr/src/app:delegated
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red

networks:
  red:
